[build-system]
requires = ["hatchling>=1.32.4", "cython>=3.3.0"]
build-backend = "hatchling.build"

[project]
name = "mlfinlab"
version = "1.3.0"
description = "MlFinlab helps portfolio managers and traders who want to leverage the power of machine learning by providing reproducible, interpretable, and easy to use tools."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "All Rights Reserved"}
authors = [
    {name = "Hudson and Thames Quantitative Research", email = "research@hudsonthames.org"},
]
keywords = ["machinelearning", "finance", "investment", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "POT>=0.9.7.post1",
    "numba>=0.68.0",
    "networkx>=3.7",
    "dash>=4.4.1",
    "dash-cytoscape>=1.0.2",
    "dash-bootstrap-components>=2.0.4",
    "jupyter-dash>=0.4.2",
    "tensorflow>=2.21.0",
    "joblib>=1.6.0",
    "decorator>=5.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.16.2",
    "pylint>=4.1.3",
]

[tool.uv]
default-groups = ["dev"]

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.urls]
Homepage = "https://www.hudsonthames.org/"
Documentation = "https://mlfinlab.readthedocs.io/en/latest/"
"Bug Reports" = "https://github.com/hudson-and-thames/mlfinlab/issues"
"Project Boards" = "https://github.com/orgs/hudson-and-thames/projects"
Source = "https://github.com/hudson-and-thames/mlfinlab"
Blog = "https://hudsonthames.org/blog/"
"Apprenticeship Program" = "https://hudsonthames.org/apprenticeship-program/"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfinlab"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlfinlab/**",
    "README.md",
    "LICENSE.txt",
]
exclude = [
    "contrib",
    "docs",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["mlfinlab"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

