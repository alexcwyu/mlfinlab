[build-system]
requires = ["hatchling", "cython>=3.2.1"]
build-backend = "hatchling.build"

[project]
name = "mlfinlab"
version = "1.3.0"
description = "MlFinlab helps portfolio managers and traders who want to leverage the power of machine learning by providing reproducible, interpretable, and easy to use tools."
readme = "README.md"
requires-python = "==3.13.*"
license = {text = "All Rights Reserved"}
authors = [
    {name = "Hudson and Thames Quantitative Research", email = "research@hudsonthames.org"},
]
keywords = ["machinelearning", "finance", "investment", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.3.4",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "POT>=0.9.6",
    "numba>=0.62.1",
    "networkx>=3.5",
    "dash>=3.3.0",
    "dash-cytoscape>=1.0.2",
    "dash-bootstrap-components>=2.0.4",
    "jupyter-dash>=0.4.2",
    "tensorflow>=2.20.0",
    "joblib>=1.5.2",
    "decorator>=5.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.10",
    "pylint>=3.3.5",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]

[project.urls]
Homepage = "https://www.hudsonthames.org/"
Documentation = "https://mlfinlab.readthedocs.io/en/latest/"
"Bug Reports" = "https://github.com/hudson-and-thames/mlfinlab/issues"
"Project Boards" = "https://github.com/orgs/hudson-and-thames/projects"
Source = "https://github.com/hudson-and-thames/mlfinlab"
Blog = "https://hudsonthames.org/blog/"
"Apprenticeship Program" = "https://hudsonthames.org/apprenticeship-program/"

[tool.hatch.build.targets.wheel]
packages = ["mlfinlab"]

[tool.hatch.build.targets.sdist]
include = [
    "mlfinlab/**",
    "README.md",
    "LICENSE.txt",
]
exclude = [
    "contrib",
    "docs",
    "tests",
]

